<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aknium Music - Authentication</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --muted-text: #94a3b8;
      --error-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .auth-container { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 8px; font-size: 1.5rem; text-align: center; }
    p.subtitle { color: var(--muted-text); font-size: 0.875rem; text-align: center; margin-bottom: 24px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted-text); }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent-color); }

    .code-input { text-align: center; letter-spacing: 8px; font-size: 1.5rem; font-weight: bold; }

    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background-color: var(--accent-color); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    button:hover { background-color: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .alert { font-size: 0.875rem; padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center; display: none; }
    .alert-error { background-color: rgba(239, 68, 68, 0.15); color: var(--error-color); border: 1px solid var(--error-color); }
    .alert-success { background-color: rgba(34, 197, 94, 0.15); color: var(--success-color); border: 1px solid var(--success-color); }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div id="alertBox" class="alert"></div>

    <!-- STEP 1: SIGNUP FORM -->
    <form id="signupForm">
      <h2>Create Account</h2>
      <p class="subtitle">Join Aknium Music to start listening</p>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="John" required>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" minlength="8" required>
      </div>

      <button type="submit" id="signupBtn">Sign Up</button>
    </form>

    <!-- STEP 2: 6-DIGIT VERIFICATION FORM -->
    <form id="verifyForm" class="hidden">
      <h2>Enter Verification Code</h2>
      <p class="subtitle">We sent a 6-digit code to your email address.</p>

      <div class="form-group">
        <label for="code">6-Digit Code</label>
        <input type="text" id="code" class="code-input" maxlength="6" placeholder="123456" required autocomplete="one-time-code">
      </div>

      <button type="submit" id="verifyBtn">Verify Email</button>
    </form>

    <!-- STEP 3: SUCCESS VIEW -->
    <div id="successView" class="hidden" style="text-align: center;">
      <h2>Welcome to Aknium! 🎉</h2>
      <p class="subtitle">Your email has been verified. You are now logged in.</p>
    </div>
  </div>

  <script>
    // Automatically sets backend URL depending on environment
    const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:3000' 
      : 'https://aknium-auth.onrender.com';

    let pendingToken = '';

    const signupForm = document.getElementById('signupForm');
    const verifyForm = document.getElementById('verifyForm');
    const successView = document.getElementById('successView');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, isError = true) {
      alertBox.textContent = message;
      alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    // 1. Handle Signup Submit
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const payload = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      try {
        const response = await fetch(`${BACKEND_URL}/api/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
          pendingToken = data.pendingAuthenticationToken || '';
          signupForm.classList.add('hidden');
          verifyForm.classList.remove('hidden');
          showAlert(data.message, false);
        } else {
          showAlert(data.error || 'Signup failed.');
        }
      } catch (err) {
        showAlert('Unable to connect to the server. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    });

    // 2. Handle Verification Code Submit
    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      const code = document.getElementById('code').value.trim();

      try {
        const response = await fetch(`${BACKEND_URL}/api/verify-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            pendingAuthenticationToken: pendingToken
          })
        });

        const data = await response.json();

        if (data.success) {
          verifyForm.classList.add('hidden');
          successView.classList.remove('hidden');
          hideAlert();
          // Store token in browser storage
          if (data.accessToken) {
            localStorage.setItem('aknium_access_token', data.accessToken);
          }
        } else {
          showAlert(data.error || 'Invalid verification code.');
        }
      } catch (err) {
        showAlert('Failed to connect to verification server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify Email';
      }
    });
  </script>
</body>
</html>
