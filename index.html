<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aknium Music</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --muted-text: #94a3b8;
      --error-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .auth-container { background-color: var(--card-bg); width: 100%; max-width: 450px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
    
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .dashboard-header h2 { margin-bottom: 0; font-size: 1.4rem; }

    .signout-btn { background-color: rgba(239, 68, 68, 0.15); color: var(--error-color); border: 1px solid var(--error-color); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .signout-btn:hover { background-color: var(--error-color); color: white; }

    h2 { margin-bottom: 4px; font-size: 1.5rem; text-align: center; }
    p.subtitle { color: var(--muted-text); font-size: 0.875rem; text-align: left; margin-bottom: 20px; }
    #authHeader p.subtitle { text-align: center; }
    
    /* Navigation Tabs */
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--muted-text); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted-text); }
    
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent-color); }

    /* Password Input Wrapper with Toggle Button */
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 45px; }
    .toggle-password { position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--muted-text); padding: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
    .toggle-password:hover { color: var(--text-color); }

    .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background-color: var(--accent-color); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .submit-btn:hover { background-color: var(--accent-hover); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .alert { font-size: 0.875rem; padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center; display: none; word-break: break-word; }
    .alert-error { background-color: rgba(239, 68, 68, 0.15); color: var(--error-color); border: 1px solid var(--error-color); }
    
    /* Music Library Dashboard */
    .track-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
    .track-item { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #334155; }
    .track-title { font-weight: 600; font-size: 0.95rem; text-transform: capitalize; }
    audio { width: 100%; height: 35px; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div id="authHeader">
      <h2 id="authTitle">Aknium Music</h2>
      <p class="subtitle" id="authSubtitle">Sign up or sign in to listen</p>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabSignupBtn" onclick="switchTab('signup')">Sign Up</button>
        <button type="button" class="tab-btn" id="tabSigninBtn" onclick="switchTab('signin')">Sign In</button>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- SIGN UP FORM -->
    <form id="signupForm">
      <div class="form-group">
        <label for="signUpFirstName">First Name</label>
        <input type="text" id="signUpFirstName" placeholder="Anugrah" required>
      </div>
      <div class="form-group">
        <label for="signUpLastName">Last Name</label>
        <input type="text" id="signUpLastName" placeholder="Krishna" required>
      </div>
      <div class="form-group">
        <label for="signUpEmail">Gmail Address</label>
        <input type="email" id="signUpEmail" placeholder="Anugrah@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="signUpPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signUpPassword" placeholder="••••••••" minlength="8" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signUpPassword', this)" title="Show/Hide Password">👁️</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="signupSubmitBtn">Create Account</button>
    </form>

    <!-- SIGN IN FORM -->
    <form id="signinForm" class="hidden">
      <div class="form-group">
        <label for="signInEmail">Gmail Address</label>
        <input type="email" id="signInEmail" placeholder="Anugrah@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="signInPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signInPassword" placeholder="••••••••" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signInPassword', this)" title="Show/Hide Password">👁️</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="signinSubmitBtn">Sign In</button>
    </form>

    <!-- MUSIC DASHBOARD VIEW (Shown after login) -->
    <div id="musicDashboard" class="hidden">
      <div class="dashboard-header">
        <h2>Aknium Library 🎶</h2>
        <button type="button" class="signout-btn" onclick="signOut()">Sign Out</button>
      </div>
      <p class="subtitle" id="welcomeUser">Welcome back!</p>
      <div id="trackList" class="track-list">
        <p style="text-align: center; color: var(--muted-text);">Loading tracks from storage...</p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:3000' 
      : 'https://aknium-auth.onrender.com';

    const signupForm = document.getElementById('signupForm');
    const signinForm = document.getElementById('signinForm');
    const musicDashboard = document.getElementById('musicDashboard');
    const authHeader = document.getElementById('authHeader');
    const alertBox = document.getElementById('alertBox');
    const tabSignupBtn = document.getElementById('tabSignupBtn');
    const tabSigninBtn = document.getElementById('tabSigninBtn');

    function showAlert(message, isError = true) {
      alertBox.textContent = message;
      alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function switchTab(tab) {
      hideAlert();
      if (tab === 'signup') {
        tabSignupBtn.classList.add('active');
        tabSigninBtn.classList.remove('active');
        signupForm.classList.remove('hidden');
        signinForm.classList.add('hidden');
      } else {
        tabSigninBtn.classList.add('active');
        tabSignupBtn.classList.remove('active');
        signinForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
      }
    }

    function togglePasswordVisibility(fieldId, btn) {
      const inputField = document.getElementById(fieldId);
      if (inputField.type === 'password') {
        inputField.type = 'text';
        btn.textContent = '🔒';
      } else {
        inputField.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function signOut() {
      localStorage.removeItem('aknium_access_token');
      musicDashboard.classList.add('hidden');
      authHeader.classList.remove('hidden');
      switchTab('signin');
    }

    async function loadMusicTracks() {
      try {
        const response = await fetch(`${BACKEND_URL}/api/music`, {
          method: 'GET',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('aknium_access_token')}`
          }
        });

        const data = await response.json();
        const trackListEl = document.getElementById('trackList');

        if (data.success && data.tracks && data.tracks.length > 0) {
          trackListEl.innerHTML = '';
          data.tracks.forEach(track => {
            const trackDiv = document.createElement('div');
            trackDiv.className = 'track-item';
            trackDiv.innerHTML = `
              <div class="track-title">${track.title}</div>
              <audio controls src="${track.audio_url}"></audio>
            `;
            trackListEl.appendChild(trackDiv);
          });
        } else {
          trackListEl.innerHTML = '<p style="text-align: center; color: var(--muted-text);">No audio files found in Songs bucket.</p>';
        }
      } catch (err) {
        document.getElementById('trackList').innerHTML = '<p style="text-align: center; color: var(--error-color);">Failed to load audio tracks.</p>';
      }
    }

    function showDashboard(userName) {
      authHeader.classList.add('hidden');
      signupForm.classList.add('hidden');
      signinForm.classList.add('hidden');
      hideAlert();
      
      document.getElementById('welcomeUser').textContent = `Welcome, ${userName || 'Music Lover'}!`;
      musicDashboard.classList.remove('hidden');
      loadMusicTracks();
    }

    // 1. Handle Sign Up
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('signupSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const payload = {
        firstName: document.getElementById('signUpFirstName').value,
        lastName: document.getElementById('signUpLastName').value,
        email: document.getElementById('signUpEmail').value,
        password: document.getElementById('signUpPassword').value,
      };

      try {
        const response = await fetch(`${BACKEND_URL}/api/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
          if (data.accessToken) {
            localStorage.setItem('aknium_access_token', data.accessToken);
          }
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.error || 'Signup failed.');
        }
      } catch (err) {
        showAlert('Unable to connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    // 2. Handle Sign In
    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('signinSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const payload = {
        email: document.getElementById('signInEmail').value,
        password: document.getElementById('signInPassword').value,
      };

      try {
        const response = await fetch(`${BACKEND_URL}/api/signin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
          if (data.accessToken) {
            localStorage.setItem('aknium_access_token', data.accessToken);
          }
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showAlert('Unable to connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
